<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>وصفتك — Coffee World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css" />
<style>
  @media print {
    .site-header, .site-footer, .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body data-page="recipe">
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <span class="brand-logo">CW</span>
        <span>Coffee World</span>
      </a>
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html" data-page="home">الرئيسية</a></li>
        <li><a href="recipe.html" data-page="recipe">ابتكر وصفتك</a></li>
        <li><a href="marketplace.html" data-page="marketplace">السوق</a></li>
        <li><a href="baristas.html" data-page="baristas">البريستا</a></li>
      </ul>
    </div>
  </header>

  <main class="container section">
    <div class="section-title">
      <div>
        <h2>وصفتك جاهزة</h2>
        <p>اعرض هذه الصفحة للبريستا، أو اطبعها، أو احفظها لاستخدامها لاحقاً.</p>
      </div>
      <div class="no-print" style="display:flex; gap:8px; flex-wrap:wrap;">
        <a href="recipe.html" class="btn btn-outline">← رجوع للتعديل</a>
        <button class="btn btn-gold" id="print-btn">🖨️ طباعة</button>
        <button class="btn btn-primary" id="save-btn">💾 حفظ</button>
      </div>
    </div>

    <div class="cup-stage">
      <!-- Left: visual cup -->
      <div class="card">
        <h3 style="margin-top:0;color:var(--coffee-900);">الكوب</h3>
        <div class="cup-wrap">
          <div class="cup">
            <div class="lid"></div>
            <div class="notes" id="cup-notes"></div>
            <div class="sleeve">
              <div class="logo">COFFEE<br/>WORLD</div>
            </div>
            <div class="scribble" id="cup-scribble"></div>
          </div>
        </div>
        <p class="hint" id="cup-summary" style="text-align:center; color:var(--muted); margin-top:10px;"></p>
      </div>

      <!-- Right: recipe paper -->
      <div class="recipe-paper" id="recipe-paper">
        <h3 id="rp-title">—</h3>
        <div class="meta" id="rp-meta">—</div>
        <ul id="rp-list"></ul>
        <p id="rp-notes" style="margin-top:10px; color:var(--coffee-800);"></p>
        <div style="margin-top:12px; font-size:12px; color:var(--muted);">
          رمز الوصفة: <b id="rp-id">—</b>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> Coffee World</div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/recipe-data.js"></script>
  <script src="../assets/js/cup.js"></script>
</body>
</html>
