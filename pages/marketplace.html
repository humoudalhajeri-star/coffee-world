<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سوق القهوة — Coffee World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/marketplace.css" />
</head>
<body data-page="marketplace">
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <span class="brand-logo">CW</span>
        <span>Coffee World</span>
      </a>
      <button class="menu-toggle" aria-label="القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="../index.html" data-page="home">الرئيسية</a></li>
        <li><a href="recipe.html" data-page="recipe">ابتكر وصفتك</a></li>
        <li><a href="marketplace.html" data-page="marketplace">السوق</a></li>
        <li><a href="baristas.html" data-page="baristas">البريستا</a></li>
      </ul>
    </div>
  </header>

  <main class="container section">
    <div class="market-hero">
      <div>
        <h2>سوق القهوة ☕</h2>
        <p>تصفّح الإعلانات أو أضف إعلانك الجديد بصور احترافية.</p>
      </div>
    </div>

    <div class="market-toolbar">
      <input id="search" class="input" placeholder="🔍 ابحث بالعنوان، الوصف، الفئة أو المدينة..." />
      <select id="filter-category" class="select">
        <option value="">كل الفئات</option>
        <option value="beans">حبوب قهوة</option>
        <option value="machines">مكائن وإسبريسو</option>
        <option value="grinders">مطاحن</option>
        <option value="accessories">أدوات وإكسسوارات</option>
        <option value="cups">أكواب وعبوات</option>
        <option value="syrups">نكهات وبومب</option>
        <option value="other">أخرى</option>
      </select>
    </div>

    <div id="listings" class="market-grid"></div>
  </main>

  <!-- Floating "Add listing" button (Haraj-style) -->
  <button class="market-fab" id="new-listing-btn">
    <span style="font-size:20px; line-height:1;">＋</span>
    <span>أضف إعلانك</span>
  </button>

  <!-- Modal: New listing (photo-first, Haraj-style) -->
  <div class="modal-backdrop" id="listing-modal">
    <div class="modal">
      <header>
        <h3>إعلان جديد</h3>
        <button class="close" id="close-listing">×</button>
      </header>
      <form id="listing-form">
        <!-- Photos FIRST — like Haraj -->
        <div class="field">
          <label>الصور <small class="hint">(أول صورة هي الرئيسية)</small></label>
          <div class="photo-uploader" id="listing-preview"></div>
          <input type="file" id="listing-files" accept="image/*" multiple style="display:none;" />
          <p class="photo-count-hint" id="photo-count-hint">اضغط + لإضافة صور (حتى 10)</p>
        </div>

        <!-- Basic info -->
        <div class="field" style="margin-top:14px;">
          <label>العنوان *</label>
          <input name="title" class="input" required maxlength="80" placeholder="مثال: مكينة إسبريسو شبه أوتوماتيكية" />
        </div>

        <div class="form-grid" style="margin-top:10px;">
          <div class="field">
            <label>السعر (ر.س)</label>
            <input name="price" type="number" min="0" class="input" placeholder="0" />
          </div>
          <div class="field">
            <label>الفئة *</label>
            <select name="category" class="select" required>
              <option value="">اختر...</option>
              <option value="beans">حبوب قهوة</option>
              <option value="machines">مكائن وإسبريسو</option>
              <option value="grinders">مطاحن</option>
              <option value="accessories">أدوات وإكسسوارات</option>
              <option value="cups">أكواب وعبوات</option>
              <option value="syrups">نكهات وبومب</option>
              <option value="other">أخرى</option>
            </select>
          </div>
          <div class="field">
            <label>المدينة</label>
            <input name="city" class="input" placeholder="الرياض، جدة، ..." />
          </div>
          <div class="field">
            <label>رقم التواصل *</label>
            <input name="phone" class="input" required placeholder="05xxxxxxxx" />
          </div>
        </div>

        <div class="field" style="margin-top:10px;">
          <label>الوصف</label>
          <textarea name="description" class="textarea" maxlength="600" placeholder="اذكر حالة المنتج، السنة، الضمان..."></textarea>
        </div>

        <div style="display:flex; gap:10px; margin-top:18px; justify-content:flex-end;">
          <button type="button" class="btn btn-outline" id="cancel-listing">إلغاء</button>
          <button type="submit" class="btn btn-gold">نشر الإعلان</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> Coffee World</div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script type="module" src="../assets/js/firebase-init.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/marketplace.js"></script>
</body>
</html>
